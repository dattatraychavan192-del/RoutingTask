<div class="card">
  <h2 mat-dialog-title>Delete User</h2>
  <div class="card-header">{{ msg }}</div>
  <div class="card-body"></div>
  <div class="card-footer d-flex justify-content-between">
    <button
      mat-raised-button
      color="primary"
      aria-label="Example icon button with a filter list icon"
      (click)="onClose(true)"
    >
      Yes
    </button>

    <button
      mat-raised-button
      color="warn"
      aria-label="Example icon button with a filter list icon"
      (click)="onClose(false)"
    >
      No
    </button>
  </div>
</div>
