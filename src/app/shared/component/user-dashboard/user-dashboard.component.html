<div class="container">
  <div class="row align-items-between mb-4">
    <div class="col-md-6">
      <h2 class="text-primary">User Dashboard</h2>
    </div>
    <div class="col-md-6">
      <button class="btn btn-outline-primary shadow" routerLink="/user-form">
        Add User
      </button>
    </div>
  </div>
  <div class="row align-items-between mb-4">
    <div class="col-md-8">
      <ul class="list-group shadow">
        <li
          class="list-group-item"
          *ngFor="let user of userArr"
          [routerLink]="['/user', user.id]"
          role="button"
        >
          <span class="fw-semibold">{{ user.name }}</span>
        </li>
      </ul>

      <p class="text-muted text-center mt-4" *ngIf="userArr.length === 0">
        No users available.
      </p>
    </div>
  </div>
</div>
